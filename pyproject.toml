[project]
name = "inlay"
version = "0.1.0"
description = "Guitar fretboard detection and future music transcription"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.3.5",
    # contrib build, not opencv-python: mediapipe requires opencv-contrib-python and
    # two distributions cannot share the cv2 namespace. Same OpenCV version as before.
    "opencv-contrib-python==4.13.0.92",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
transcribe = [
    # 1.0.x macOS arm64 wheels abort in TensorsToDetectionsCalculator (Metal graph
    # service unavailable), so the hand landmarker is pinned to the last good build.
    "mediapipe==0.10.35",
    "basic-pitch==0.4.0",
    # basic-pitch pins resampy<0.4.3, and resampy 0.4.2 imports pkg_resources,
    # which setuptools removed in 81.
    "setuptools<81",
]

[dependency-groups]
dev = ["pyright==1.1.414"]

[tool.uv]
package = false

[tool.pyright]
include = ["processing", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
